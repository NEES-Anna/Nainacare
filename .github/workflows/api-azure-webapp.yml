name: Deploy API to Azure Web App
on:
  push:
    branches: [ "main" ]
    paths:
      - 'api/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # optional: run quick import check
          python -c "import sys; print('✅ deps ok')"

      # Package the api folder for zip deploy
      - name: Create artifact
        run: |
          cd api
          zip -r ../api.zip .

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}  # create this secret (Service Principal or Federated)

      - name: Deploy to Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: nainacare-api           # <-- your App Service name
          package: api.zip
          startup-command: >
            sh -c "pip install -r requirements.txt &&
                   gunicorn -w 2 -k uvicorn.workers.UvicornWorker main:app --bind=0.0.0.0:8000"
